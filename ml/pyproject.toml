[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowd"
version = "0.1.0"
description = "CSRNet crowd density estimation: data pipeline, training, inference."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "h5py>=3.10",
  "pyyaml>=6.0.3",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
detect = ["ultralytics>=8.3"]  # labelled boxes (`crowd.detect`); optional
eval = ["matplotlib>=3.8"]  # offline plots in `crowd.evaluate`; the API does not need it
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["crowd*"]

[tool.setuptools.package-data]
crowd = ["thresholds.json", "routing.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["dataset: needs the real ShanghaiTech data under data/ (skipped in CI)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "C4", "PT"]
ignore = ["PT018"]  # compound asserts read fine in tests
