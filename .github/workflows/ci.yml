name: CI
on:
  push: {branches: [main]}
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ml + api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/pyproject.toml
            api/requirements.txt
      - name: Install (CPU torch, no dataset, no checkpoints)
        run: |
          pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r api/requirements-dev.txt
          pip install -e "ml[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest ml/tests -q -m "not dataset"
      - name: API tests (randomly initialised model)
        run: pytest api/tests -q
        working-directory: api

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image (not pushed)
        run: docker build -f api/Dockerfile -t crowd-api .
      - name: Build web image (not pushed)
        run: docker build -t crowd-web web
