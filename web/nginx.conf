server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Slightly above the API's 10 MB limit so the API, not nginx, produces the readable 413.
  client_max_body_size 11m;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 120s;  # CPU inference of a 1600 px image plus queueing
  }

  location / {
    try_files $uri /index.html;
  }
}
